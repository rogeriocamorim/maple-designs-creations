services:
  postgres:
    container_name: mapledesigns-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mapledesigns
      POSTGRES_USER: mapledesigns
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapledesigns"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    container_name: mapledesigns-app
    image: ghcr.io/rogeriocamorim/maple-designs-creations:latest
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      DATABASE_URL: postgresql://mapledesigns:${POSTGRES_PASSWORD}@postgres:5432/mapledesigns
    depends_on:
      postgres:
        condition: service_healthy

  watchtower:
    container_name: mapledesigns-watchtower
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: 60
      WATCHTOWER_INCLUDE_STOPPED: "false"
    command: mapledesigns-app

volumes:
  postgres_data:
